# One codebase, three deployments.
#
# Each environment is a separate Worker with its OWN key, its own KV state and
# its own schedule. Nothing is shared between them at runtime: they discover
# markets independently, decide independently, and only ever meet at the
# portfolio contract. That is what makes the shared-envelope claim testable.
#
# Secrets per environment (wrangler secret put --env <name>):
#   AGENT_PRIVATE_KEY   the agent's own key
#   AGENT_TOKEN         optional, enables the manual /tick trigger

name = "airspace-agent"
main = "src/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]
# The agents expose /health and /status only. /tick spends the agent's gas and
# is gated behind AGENT_TOKEN; without that secret the route does not exist.
workers_dev = true

[[kv_namespaces]]
binding = "AGENT_STATE"
id = "airspace-agent-state-local"

[vars]
CHAIN_ID = "50312"
SHANNON_RPC = "https://dream-rpc.somnia.network"
SHANNON_RPC_FALLBACK = "https://rpc.ankr.com/somnia_testnet"
AIRSPACE_PORTFOLIO = ""
AIRSPACE_API = ""
AGENT_STRATEGY = "momentum"
AGENT_SIZE = "40000000"
AGENT_CADENCE = "900"

# --- momentum -----------------------------------------------------------------
[env.momentum]
name = "airspace-agent-momentum"

[env.momentum.triggers]
crons = ["* * * * *"]

[env.momentum.vars]
CHAIN_ID = "50312"
SHANNON_RPC = "https://dream-rpc.somnia.network"
SHANNON_RPC_FALLBACK = "https://rpc.ankr.com/somnia_testnet"
AIRSPACE_PORTFOLIO = "0x2839EA7138c1cB783272041D55Ed6e9e29f2D4Bc"
AIRSPACE_API = "https://airspace-api.timjosh507.workers.dev"
AGENT_STRATEGY = "momentum"
AGENT_SIZE = "40000000"
AGENT_CADENCE = "900"

[[env.momentum.kv_namespaces]]
binding = "AGENT_STATE"
id = "ad45ca93966a44fdb8b961ea400196eb"

