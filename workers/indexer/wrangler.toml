name = "airspace-indexer"
main = "src/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

# Somnia produces blocks fast, so the indexer runs every minute and each run is
# bounded by INGEST_WINDOW. A run that does not reach the head simply resumes
# from its cursor on the next tick; nothing is skipped.
[triggers]
crons = ["* * * * *"]

[vars]
CHAIN_ID = "50312"
SHANNON_RPC = "https://dream-rpc.somnia.network"
SHANNON_RPC_FALLBACK = "https://rpc.ankr.com/somnia_testnet"
AIRSPACE_FACTORY = "0x342d200aCF529905CC815D4ff9841053ea1c2D61"
SUPABASE_URL = "https://ldhkqnedurkaxehufchg.supabase.co"
INGEST_WINDOW = "20000"

# Secrets (wrangler secret put): SUPABASE_SERVICE_ROLE_KEY, INDEXER_TOKEN
