name = "airspace-api"
main = "src/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# The web app is served from the same Worker, so there is no separate origin and
# no CORS hop for the product's own pages.
[assets]
directory = "../../apps/web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# One Durable Object per portfolio. Partitioning this way is what keeps the
# system free of global mutable state as portfolio count grows.
[[durable_objects.bindings]]
name = "PORTFOLIO"
class_name = "PortfolioCoordinator"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PortfolioCoordinator"]

[[queues.producers]]
binding = "RECONCILE_QUEUE"
queue = "airspace-reconcile"

[vars]
CHAIN_ID = "50312"
SHANNON_RPC = "https://dream-rpc.somnia.network"
