name = "airspace-lifecycle"
main = "src/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Every minute: fast cadences roll every 60s, so the scan has to keep up with
# generations rather than with markets.
[triggers]
crons = ["* * * * *"]

[[queues.producers]]
binding = "RECONCILE_QUEUE"
queue = "airspace-reconcile"

[[queues.consumers]]
queue = "airspace-reconcile"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 5
dead_letter_queue = "airspace-reconcile-dlq"

[vars]
CHAIN_ID = "50312"
SHANNON_RPC = "https://dream-rpc.somnia.network"
SHANNON_RPC_FALLBACK = "https://rpc.ankr.com/somnia_testnet"
AIRSPACE_FACTORY = ""
SUPABASE_URL = ""

# Secrets (wrangler secret put): SUPABASE_SERVICE_ROLE_KEY, KEEPER_PRIVATE_KEY
