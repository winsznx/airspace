name = "airspace-lifecycle"
main = "src/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Every minute: fast cadences roll every 60s, so the scan has to keep up with
# generations rather than with markets.
[triggers]
crons = ["* * * * *"]

[[queues.producers]]
binding = "RECONCILE_QUEUE"
queue = "airspace-reconcile"

[[queues.consumers]]
queue = "airspace-reconcile"
max_batch_size = 10
# One keeper key signs every job, so batches must not run in parallel: two
# concurrent invocations would each sequence nonces from the same starting
# point and one would always be rejected.
max_concurrency = 1
max_batch_timeout = 5
max_retries = 5
dead_letter_queue = "airspace-reconcile-dlq"

[vars]
CHAIN_ID = "50312"
SHANNON_RPC = "https://dream-rpc.somnia.network"
SHANNON_RPC_FALLBACK = "https://rpc.ankr.com/somnia_testnet"
AIRSPACE_FACTORY = "0x342d200aCF529905CC815D4ff9841053ea1c2D61"
SUPABASE_URL = "https://ldhkqnedurkaxehufchg.supabase.co"

# Secrets (wrangler secret put): SUPABASE_SERVICE_ROLE_KEY, KEEPER_PRIVATE_KEY
