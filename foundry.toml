[profile.default]
# Production contracts land in contracts/ (empty until the PRD/DESIGN pass).
src = "contracts"
# The archived hostile-validation stages live under engineering/ and remain
# compilable and re-runnable: `forge test` discovers every stage's suite.
test = "engineering"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"
gas_limit = "max"
memory_limit = 134217728

[rpc_endpoints]
shannon = "https://dream-rpc.somnia.network"
