[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["../lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"
gas_limit = "max"
memory_limit = 134217728
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 256
depth = 32
fail_on_revert = false

[profile.ci.fuzz]
runs = 2000

[rpc_endpoints]
shannon = "${SHANNON_RPC}"
